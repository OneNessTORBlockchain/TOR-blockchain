<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TOR pump logo">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="0.55" stop-color="#ff2f7a"/>
      <stop offset="1" stop-color="#ffe3cf"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffe3cf"/>
      <stop offset="1" stop-color="#ff2f7a"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#060a12"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3cf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#ff7a3d" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#plate)"/>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#grid)"/>
  <path d="M28 196l100-58 100 58-100 58z" fill="#ff7a3d" opacity="0.08"/>
  <path d="M28 60l100-58 100 58-100 58z" fill="#ff2f7a" opacity="0.06"/>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
  <g filter="url(#glow)" stroke-linejoin="round">
      <path d="M96 166c0-38 16-70 32-92 16 22 32 54 32 92" fill="none"
            stroke="url(#neon)" stroke-width="10" stroke-linejoin="round"/>
      <path d="M112 168h32l-16 28z" fill="url(#core)"/>
      <path d="M78 132l-14 12 20 4M178 132l14 12-20 4" fill="none"
            stroke="url(#neon)" stroke-width="8" stroke-linecap="round"/>
    </g>
  <text x="128" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="15" letter-spacing="4" fill="#ffe3cf" fill-opacity="0.85">TOR</text>
</svg>
