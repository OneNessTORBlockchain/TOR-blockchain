<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TOR sun logo">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc94a"/>
      <stop offset="0.55" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#fff4d2"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff4d2"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#060a12"/>
      <stop offset="1" stop-color="#ffc94a" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffc94a" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#ffc94a" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#plate)"/>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#grid)"/>
  <path d="M28 196l100-58 100 58-100 58z" fill="#ffc94a" opacity="0.08"/>
  <path d="M28 60l100-58 100 58-100 58z" fill="#ff7a2f" opacity="0.06"/>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
  <g filter="url(#glow)" stroke-linejoin="round">
      <circle cx="128" cy="128" r="38" fill="none" stroke="url(#neon)" stroke-width="10"/>
      <circle cx="128" cy="128" r="13" fill="url(#core)"/>
      <g stroke="url(#neon)" stroke-width="8" stroke-linecap="round">
        <path d="M128 62v20M128 174v20M62 128h20M174 128h20"/>
        <path d="M81 81l14 14M161 161l14 14M175 81l-14 14M95 161l-14 14"/>
