<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TOR swap logo">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0d0"/>
      <stop offset="0.55" stop-color="#0aa5ff"/>
      <stop offset="1" stop-color="#b8fff4"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#b8fff4"/>
      <stop offset="1" stop-color="#0aa5ff"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#060a12"/>
      <stop offset="1" stop-color="#00f0d0" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fff4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00f0d0" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#00f0d0" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#plate)"/>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#grid)"/>
  <path d="M28 196l100-58 100 58-100 58z" fill="#00f0d0" opacity="0.08"/>
  <path d="M28 60l100-58 100 58-100 58z" fill="#0aa5ff" opacity="0.06"/>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
  <g filter="url(#glow)" stroke-linejoin="round">
      <path d="M84 96h62l-14-15" fill="none" stroke="url(#neon)" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M172 160H110l14 15" fill="none" stroke="url(#neon)" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="84" cy="96" r="9" fill="url(#core)"/>
      <circle cx="172" cy="160" r="9" fill="url(#core)"/>
    </g>
  <text x="128" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="15" letter-spacing="4" fill="#b8fff4" fill-opacity="0.85">TOR</text>
</svg>
