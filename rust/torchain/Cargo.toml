[package]
name = "torchain"
version = "0.1.0"
edition = "2021"
description = "OneNess TOR native chain manager: permanent ledger, wallets, transfers, deposits, swaps, 30-day public data window"
license = "MIT"

[[bin]]
name = "torchain"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2"
bip39 = { version = "2", features = ["rand"] }
bs58 = "0.5"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
